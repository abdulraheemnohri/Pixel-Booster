name: Release Signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (must match app versionName; current version is v2.0.0)"
        required: true
        type: string
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, sign, and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android SDK command-line tools were not found under $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-sdk-licenses.txt"
          "$SDKMANAGER" --licenses < "$RUNNER_TEMP/android-sdk-licenses.txt" >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Validate release configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing GitHub Actions secrets. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v2.0.0."
            exit 1
          fi
          APP_VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$APP_VERSION" || "$RELEASE_TAG" != "v$APP_VERSION" ]]; then
            echo "::error::Release tag ($RELEASE_TAG) must match app/build.gradle.kts versionName (v$APP_VERSION)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pixel-booster-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pixel-booster-signing/upload.jks"
          chmod 600 "$RUNNER_TEMP/pixel-booster-signing/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/pixel-booster-signing/upload.jks" -alias upload -storepass:env KEYSTORE_PASSWORD >/dev/null
          echo "KEYSTORE_PATH=$RUNNER_TEMP/pixel-booster-signing/upload.jks" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pixel-booster-signing/upload.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PixelBooster-${RELEASE_TAG}.apk"
          sha256sum "dist/PixelBooster-${RELEASE_TAG}.apk" > "dist/PixelBooster-${RELEASE_TAG}.apk.sha256"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: Pixel Booster ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/PixelBooster-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}.apk
            dist/PixelBooster-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}.apk.sha256
