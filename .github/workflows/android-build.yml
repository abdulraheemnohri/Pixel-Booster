name: Android Build & Release CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release APK/AAB'
        type: boolean
        required: false
        default: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew if present
        run: if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Assemble Release APK (if requested)
        if: github.event.inputs.build_release == 'true'
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelBooster-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        if: github.event.inputs.build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PixelBooster-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
